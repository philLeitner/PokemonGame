<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Kampf</title>
    <base href="/" />
    <link rel="stylesheet" href="css/game.css" />
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="loading-box">
                <div class="pokeball-anim">⚔️</div>
                <h2>Monster Kampf</h2>
                <p class="lade-text">Wird geladen...</p>
            </div>
        </div>
    </div>
    <div id="blazor-error-ui">
        Ein Fehler ist aufgetreten. <a href="" class="reload">Neu laden</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // JSON-Download via Blazor JS-Interop
        window.downloadJson = function(filename, content) {
            const blob = new Blob([content], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
